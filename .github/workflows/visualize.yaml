name: Visualize

on:
  push:
    branches: [main]
    paths:
      - "data/**"
  workflow_dispatch:

env:
  WEBHOOK: ${{ secrets.WEBHOOK }}

jobs:
  visualize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependency
        run: pip install xlrd loguru zerohertzLib'[api]'

      - name: Run Script
        run: python src/data.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          git add prop/*/*.md
          git diff --cached --quiet || git commit -m ":rocket: docs: rank"
          git add prop/*/*.png
          git diff --cached --quiet || git commit -m ":art: update: visualization"
          git add prop/time
          git diff --cached --quiet || git commit -m ":alarm_clock: update: time series"
          git add -A
          git diff --cached --quiet || git commit -m ":bento: update: etc."
          git push
